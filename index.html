<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نشاط البحث عن الحرف</title>
    <style>
        /* إعدادات الخطوط والخلفية */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f8ff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        /* حاوية اللعبة الأساسية */
        .game-container {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 600px;
            width: 90%;
        }

        h1 {
            color: #2c3e50;
            font-size: 2em;
            margin-bottom: 10px;
        }

        p {
            font-size: 1.2em;
            color: #34495e;
            margin-bottom: 30px;
        }

        /* شبكة الحروف */
        .board {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        /* تصميم البطاقة (الحرف) */
        .card {
            width: 80px;
            height: 80px;
            background-color: #3498db;
            color: white;
            font-size: 2.5em;
            font-weight: bold;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 15px;
            cursor: pointer;
            transition: transform 0.2s, background-color 0.3s;
            user-select: none;
            box-shadow: 0 5px 15px rgba(52, 152, 219, 0.4);
        }

        .card:hover {
            transform: scale(1.1) translateY(-5px);
        }

        /* حالات البطاقة (صحيح أو خطأ) */
        .card.correct {
            background-color: #2ecc71;
            box-shadow: 0 5px 15px rgba(46, 204, 113, 0.4);
            cursor: default;
            transform: scale(1.05);
        }

        .card.wrong {
            background-color: #e74c3c;
            box-shadow: 0 5px 15px rgba(231, 76, 60, 0.4);
            cursor: default;
            animation: shake 0.5s;
        }

        /* تأثير الاهتزاز عند الخطأ */
        @keyframes shake {
            0% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            50% { transform: translateX(5px); }
            75% { transform: translateX(-5px); }
            100% { transform: translateX(0); }
        }

        /* رسائل النتيجة */
        .message {
            margin-top: 30px;
            font-size: 1.5em;
            font-weight: bold;
            padding: 15px;
            border-radius: 10px;
            transition: all 0.3s;
        }

        .message.success {
            color: #27ae60;
            background-color: #eafaf1;
            border: 2px solid #2ecc71;
        }

        .message.fail {
            color: #c0392b;
            background-color: #fdedec;
            border: 2px solid #e74c3c;
        }

        /* زر إعادة اللعب */
        button {
            margin-top: 20px;
            padding: 12px 25px;
            font-size: 1.2em;
            font-weight: bold;
            background-color: #f39c12;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.3s, transform 0.2s;
            box-shadow: 0 5px 15px rgba(243, 156, 18, 0.4);
        }

        button:hover {
            background-color: #e67e22;
            transform: scale(1.05);
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <div class="game-container">
        <h1>نشاط حرف (ض)</h1>
        <p>ابحث عن حرفي <strong>(ض)</strong> واضغط عليهما للنجاح. احذر من الحروف الأخرى!</p>
        
        <div id="game-board" class="board"></div>
        <div id="message" class="message hidden"></div>
        <button id="restart-btn" class="hidden" onclick="initGame()">العب مرة أخرى</button>
    </div>

    <script>
        const board = document.getElementById('game-board');
        const messageEl = document.getElementById('message');
        const restartBtn = document.getElementById('restart-btn');

        // إعدادات اللعبة الجديدة
        const targetLetter = 'ض';
        const targetLettersCount = 2; // عدد حروف (ض) المطلوبة للنجاح
        const randomLettersCount = 3; // عدد الحروف العشوائية الأخرى
        
        // جميع الحروف الأبجدية
        const fullLettersPool = ['أ', 'ب', 'ت', 'ث', 'ج', 'ح', 'خ', 'د', 'ذ', 'ر', 'ز', 'س', 'ش', 'ص', 'ض', 'ط', 'ظ', 'ع', 'غ', 'ف', 'ق', 'ك', 'ل', 'م', 'ن', 'هـ', 'و', 'ي'];
        
        // استبعاد الحرف المستهدف (ض) من قائمة الحروف العشوائية حتى لا يتكرر بالخطأ
        const lettersPool = fullLettersPool.filter(letter => letter !== targetLetter);
        
        let foundCount = 0;
        let isGameOver = false;

        // دالة لجلب حروف عشوائية غير الحرف المستهدف
        function getRandomLetters(count) {
            let randomLetters = [];
            for (let i = 0; i < count; i++) {
                const randomIndex = Math.floor(Math.random() * lettersPool.length);
                randomLetters.push(lettersPool[randomIndex]);
            }
            return randomLetters;
        }

        // دالة لخلط ترتيب المصفوفة
        function shuffle(array) {
            let currentIndex = array.length, randomIndex;
            while (currentIndex != 0) {
                randomIndex = Math.floor(Math.random() * currentIndex);
                currentIndex--;
                [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
            }
            return array;
        }

        // دالة بدء/تهيئة اللعبة
        function initGame() {
            // تصفير المتغيرات
            board.innerHTML = '';
            messageEl.className = 'message hidden';
            restartBtn.classList.add('hidden');
            foundCount = 0;
            isGameOver = false;

            // تجهيز مصفوفة اللعب: 2 حرف 'ض' + 3 حروف عشوائية
            let gameLetters = [];
            for(let i = 0; i < targetLettersCount; i++) {
                gameLetters.push(targetLetter);
            }
            gameLetters = gameLetters.concat(getRandomLetters(randomLettersCount));
            
            // خلط الحروف
            gameLetters = shuffle(gameLetters);

            // إنشاء البطاقات
            gameLetters.forEach(letter => {
                const card = document.createElement('div');
                card.classList.add('card');
                card.textContent = letter;
                
                card.onclick = () => handleCardClick(card, letter);
                board.appendChild(card);
            });
        }

        // معالجة الضغط على البطاقات
        function handleCardClick(card, letter) {
            if (isGameOver || card.classList.contains('correct')) return;

            if (letter === targetLetter) {
                // حالة النجاح في اختيار الحرف الصحيح
                card.classList.add('correct');
                foundCount++;
                
                // الفوز يتحقق عند إيجاد الحرفين
                if (foundCount === targetLettersCount) {
                    endGame(true);
                }
            } else {
                // حالة الرسوب
                card.classList.add('wrong');
                endGame(false);
            }
        }

        // دالة إنهاء اللعبة
        function endGame(isWin) {
            isGameOver = true;
            messageEl.classList.remove('hidden');
            restartBtn.classList.remove('hidden');
            
            if (isWin) {
                messageEl.textContent = 'أحسنت! 🌟 لقد وجدت حروف (ض) بنجاح.';
                messageEl.classList.add('success');
            } else {
                messageEl.textContent = 'للأسف ❌ لقد ضغطت على حرف خاطئ!';
                messageEl.classList.add('fail');
                
                // إظهار الحروف الصحيحة التي لم يتم الضغط عليها
                const allCards = document.querySelectorAll('.card');
                allCards.forEach(c => {
                    if (c.textContent === targetLetter && !c.classList.contains('correct')) {
                        c.style.border = '3px dashed #2ecc71';
                        c.style.color = '#2ecc71';
                        c.style.backgroundColor = 'white';
                    }
                });
            }
        }

        // تشغيل اللعبة
        initGame();
    </script>
</body>
</html>
